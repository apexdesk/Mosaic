# Paquetes de Linux (deb, rpm y Arch) con nfpm. VERSION y ARCH (amd64|arm64) los expande nfpm;
# BIN (ruta al binario) se sustituye antes con envsubst '${BIN}'.
name: mosaic
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: graphics
priority: optional
maintainer: apexdesk <50219414+apexdesk@users.noreply.github.com>
description: |
  Reference board for artists.
  Images, videos, PDF and office documents, 3D models, audio, text and sketches on an infinite GPU canvas.
homepage: https://github.com/apexdesk/Mosaic
license: PolyForm-Strict-1.0.0
contents:
  - src: ${BIN}
    dst: /usr/bin/mosaic
    file_info:
      mode: 0755
  - src: packaging/mosaic.desktop
    dst: /usr/share/applications/mosaic.desktop
  - src: packaging/mosaic-mime.xml
    dst: /usr/share/mime/packages/mosaic.xml
  - src: assets/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/mosaic-board.png
  - src: assets/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/mosaic-board.png
  - src: LICENSE
    dst: /usr/share/doc/mosaic/LICENSE
scripts:
  postinstall: packaging/postinst.sh
  postremove: packaging/postinst.sh
overrides:
  deb:
    depends: [libc6, libgcc-s1, "libasound2t64 | libasound2"]
    recommends: [libgl1, libxkbcommon0, ffmpeg]
  rpm:
    depends: [alsa-lib]
    recommends: [mesa-libGL, ffmpeg]
  archlinux:
    depends: [gcc-libs, alsa-lib]
    suggests: [ffmpeg]
