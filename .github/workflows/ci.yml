name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test --release
      # el arnés de capturas también tiene que compilar
      - run: cargo check --features selftest

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,   os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64,  os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-aarch64, os: windows-latest,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --bin mosaic --target ${{ matrix.target }}
          mkdir -p stage out
          cp target/${{ matrix.target }}/release/mosaic stage/
          cp packaging/mosaic.desktop packaging/mosaic-mime.xml LICENSE stage/
          cp assets/icon-256.png stage/mosaic-board.png
          tar -C stage -czf out/mosaic-${{ matrix.name }}.tar.gz .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --bin mosaic --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/mosaic.exe out/mosaic-${{ matrix.name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # macOS va aparte: los Mac de GitHub a veces tardan en estar libres y no deben retrasar la
  # release del resto; su paquete se añade a la release al acabar
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Build universal app bundle
        shell: bash
        run: |
          cargo build --release --bin mosaic --target aarch64-apple-darwin
          cargo build --release --bin mosaic --target x86_64-apple-darwin
          APP="Mosaic.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          lipo -create -output "$APP/Contents/MacOS/mosaic" \
            target/aarch64-apple-darwin/release/mosaic target/x86_64-apple-darwin/release/mosaic
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon-512.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          cp assets/icon-512.png icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          cp LICENSE "$APP/Contents/Resources/LICENSE"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Mosaic</string>
            <key>CFBundleDisplayName</key><string>Mosaic</string>
            <key>CFBundleIdentifier</key><string>io.github.apexdesk.mosaic</string>
            <key>CFBundleExecutable</key><string>mosaic</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(cargo pkgid | sed 's/.*[#@]//')</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" out/mosaic-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-macos
          path: out/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (x86_64)
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mosaic-linux-x86_64
          path: in
      - name: Install Flatpak and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Bundle
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          flatpak/build.sh in/mosaic-linux-x86_64.tar.gz "$ver" out/mosaic-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-flatpak-x86_64
          path: out/*
          if-no-files-found: error

  linux-packages:
    name: Linux packages (deb, rpm, Arch)
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mosaic-linux-*
          path: in
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tgz nfpm
          sudo mv nfpm /usr/local/bin/
      - name: Build packages
        run: |
          export VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          for pair in x86_64:amd64 aarch64:arm64; do
            name=${pair%%:*}; export ARCH=${pair##*:}
            mkdir -p "bin-$name"
            tar -xzf "in/mosaic-linux-$name/mosaic-linux-$name.tar.gz" -C "bin-$name" ./mosaic
            export BIN="$PWD/bin-$name/mosaic"
            envsubst '${BIN}' < packaging/nfpm.yaml > "nfpm-$name.yaml"
            for fmt in deb rpm archlinux; do
              nfpm package -f "nfpm-$name.yaml" -p $fmt -t out/
            done
          done
          cd out
          for f in mosaic_*; do mv "$f" "${f/mosaic_/mosaic-}"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-linux-packages
          path: out/*
          if-no-files-found: error

  windows-packages:
    name: Windows packages (portable, MSI, MSIX)
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mosaic-windows-*
          path: in
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build packages
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msixVer = "$ver.0"
          New-Item -ItemType Directory -Force out | Out-Null
          # certificado autofirmado para el MSIX (Publisher debe coincidir con el manifiesto)
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=apexdesk" -KeyUsage DigitalSignature -FriendlyName "Mosaic" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "mosaic" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath out/mosaic-msix.cer | Out-Null
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          foreach ($a in @(@("x86_64","x64"), @("aarch64","arm64"))) {
            $name = $a[0]; $arch = $a[1]
            $exe = (Resolve-Path "in/mosaic-windows-$name/mosaic-windows-$name.exe").Path
            # portable
            $dir = "portable-$name"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $exe "$dir/mosaic.exe"
            Copy-Item LICENSE "$dir/LICENSE.txt"
            Copy-Item windows/README-portable.txt "$dir/README.txt"
            Compress-Archive -Path "$dir/*" -DestinationPath "out/mosaic-windows-$name-portable.zip"
            # MSI
            wix build -arch $arch -d Version=$ver -d Exe=$exe -d Root=$($PWD.Path) -d UpgradeCode=3f0c9a52-7d1e-4b8a-9e64-2c5d8f1a7b30 windows/mosaic.wxs -o "out/mosaic-windows-$name.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix failed" }
            # MSIX
            $pk = "msix-$name"
            New-Item -ItemType Directory -Force "$pk/Assets" | Out-Null
            Copy-Item windows/Assets/*.png "$pk/Assets/"
            Copy-Item $exe "$pk/mosaic.exe"
            (Get-Content windows/AppxManifest.xml -Raw).Replace("@VERSION@", $msixVer).Replace("@ARCH@", $arch) | Set-Content "$pk/AppxManifest.xml" -Encoding utf8
            & $makeappx pack /d $pk /p "out/mosaic-windows-$name.msix" /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
            & $signtool sign /fd SHA256 /f sign.pfx /p mosaic "out/mosaic-windows-$name.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          }
          Remove-Item out/*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-windows-packages
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, flatpak, linux-packages, windows-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mosaic-* > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Mosaic ${tag}" --generate-notes
          fi

  release-macos:
    name: Add macOS to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mosaic-macos
          path: dist
      - name: Upload to the release (and update SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cd dist
          gh release download "$tag" -p SHA256SUMS -D old
          files=$(ls mosaic-*)
          { for f in $files; do grep -v "  $f\$" old/SHA256SUMS > old/tmp || true; mv old/tmp old/SHA256SUMS; done
            cat old/SHA256SUMS; sha256sum $files; } > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" $files SHA256SUMS --clobber
